<!DOCTYPE html>
<html>
<head>
    <title>Калькулятор матрасов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .calculator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .selector-group {
            margin-bottom: 20px;
        }
        .type-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .location-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .type-btn, .location-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #ecf0f1;
            cursor: pointer;
            border: 1px solid #bdc3c7;
            min-width: 120px;
        }
        .type-btn.active, .location-btn.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background: #27ae60;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        .tab {
            display: none;
        }
        .tab.active {
            display: block;
        }
        .price-highlight {
            font-size: 24px;
            color: #e74c3c;
            font-weight: bold;
        }
        .recommended-price {
            font-size: 24px;
            color: #27ae60;
            font-weight: bold;
        }
        .quick-input {
            margin-bottom: 15px;
        }
        .dimension-hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .additional-panel {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        .copy-text {
            margin: 15px 0;
            padding: 10px;
            background: #eef;
            border: 1px dashed #ccc;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            white-space: pre-line;
        }
        .copy-text:hover {
            background: #ddf;
        }
        .copy-notification {
            position: absolute;
            right: 10px;
            top: 10px;
            color: green;
            font-size: 12px;
            display: none;
        }
        .add-mattress-btn {
            background: #3498db !important;
            margin-top: 20px;
        }
        .reset-btn {
            background: #e74c3c !important;
        }
        .mattress-group {
            margin-bottom: 10px;
            padding: 10px;
            background: #f0f8ff;
            border-radius: 5px;
        }
        .quantity-input {
            width: 60px !important;
            display: inline-block;
            margin-right: 10px;
        }
        .calculation-steps {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
        }

        .price-choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }
        .price-option {
            border: 1px solid #d6e4ed;
            background: #fff;
            border-radius: 8px;
            padding: 12px;
        }
        .price-option h4 {
            margin: 0 0 10px;
            color: #2c3e50;
        }
        .price-option p { margin: 7px 0; }
        .price-option .recommended-price { font-size: 22px; }
        .price-note { font-size: 13px; color: #627283; margin: 4px 0 12px; }
        .grand-total { border-top: 1px solid #d6e4ed; margin-top: 15px; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор матрасов</h1>
        
        <div class="selector-group">
            <h3>Форма матраса:</h3>
            <div class="type-selector">
                <div class="type-btn active" data-type="regular">Обычный</div>
                <div class="type-btn" data-type="bangs">С челкой</div>
                <div class="type-btn" data-type="trapezoid">Трапеция</div>
            </div>
            
            <h3>Расположение:</h3>
            <div class="location-selector">
                <div class="location-btn active" data-location="windowsill">На подоконник</div>
                <div class="location-btn" data-location="hallway">В прихожую</div>
            </div>
        </div>


        <div class="quick-input">
            <label for="quick-size">Быстрый ввод размеров:</label>
            <input type="text" id="quick-size" placeholder="Например: 140x50x8 или 140*150*45*8">
            <div class="dimension-hint">Введите размеры через x или * (140x50x8 для обычного, 140x150x45x8 для трапеции)</div>
            <button id="apply-sizes">Применить размеры</button>
        </div>
        
        <div id="regular-tab" class="tab active">
            <div class="input-group">
                <label for="length">Длина (см):</label>
                <input type="number" id="length" value="140">
            </div>
            <div class="input-group">
                <label for="width">Ширина (см):</label>
                <input type="number" id="width" value="50">
            </div>
            <div class="input-group">
                <label for="height">Высота (см):</label>
                <input type="number" id="height" value="8">
            </div>
        </div>
        
        <div id="trapezoid-tab" class="tab">
            <div class="input-group">
                <label for="top-length">Длина верха (см):</label>
                <input type="number" id="top-length" value="140">
            </div>
            <div class="input-group">
                <label for="bottom-length">Длина низа (см):</label>
                <input type="number" id="bottom-length" value="150">
            </div>
            <div class="input-group">
                <label for="depth">Глубина (см):</label>
                <input type="number" id="depth" value="45">
            </div>
            <div class="input-group">
                <label for="trap-height">Высота (см):</label>
                <input type="number" id="trap-height" value="8">
            </div>
        </div>

        <div class="input-group">
            <label for="quantity">Количество матрасов:</label>
            <input type="number" id="quantity" value="1" min="1" class="quantity-input">
        </div>
        
        <button id="calculate-btn">Рассчитать стоимость</button>
        <button class="add-mattress-btn" id="add-mattress" style="display: none;">+ Добавить еще матрас</button>
        <button class="reset-btn" id="reset-calc" style="display: none;">Сбросить все</button>
        
        <div class="result" id="result">
            Введите параметры и нажмите "Рассчитать"
        </div>
        
        <div class="additional-panel" id="additional-panel">
            <h3>Тексты для копирования (нажмите на текст):</h3>


            <div class="copy-text" id="price-text-block">
                <div id="price-text"><!-- Текст будет сгенерирован автоматически --></div>
                <span class="copy-notification">Скопировано!</span>
            </div>
            
            <div class="copy-text" id="additional-offers-block">
                <div id="additional-offers"><!-- Текст будет сгенерирован автоматически --></div>
                <span class="copy-notification">Скопировано!</span>
            </div>
        </div>
    </div>

    <script>
        // В расчетах используются две палитры ткани, каждая цена выводится отдельно.
        const FABRIC_RATES = { standard: 300, premium: 650 }; // руб. за погонный метр
        const PRICE_MULTIPLIER = 4;
        const mattresses = [];
        let selectedLocation = 'windowsill';

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
                    document.getElementById(btn.dataset.type === 'trapezoid' ? 'trapezoid-tab' : 'regular-tab').classList.add('active');
                });
            });
            document.querySelectorAll('.location-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.location-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedLocation = btn.dataset.location;
                });
            });
            document.getElementById('apply-sizes').addEventListener('click', parseQuickInput);
            document.getElementById('calculate-btn').addEventListener('click', calculate);
            document.getElementById('add-mattress').addEventListener('click', addMattress);
            document.getElementById('reset-calc').addEventListener('click', resetCalculator);
            document.getElementById('price-text-block').addEventListener('click', copyToClipboard);
            document.getElementById('additional-offers-block').addEventListener('click', copyToClipboard);
            document.getElementById('quick-size').addEventListener('keydown', e => {
                if (e.key === 'Enter') parseQuickInput();
            });
        });

        function parseQuickInput() {
            const input = document.getElementById('quick-size').value.trim();
            const normalized = input.replace(/\s+/g, '').replace(/[*,хХ×X]/g, 'x').replace(/,/g, '.');
            const dimensions = normalized.split('x').map(Number);
            if (![3, 4].includes(dimensions.length) || dimensions.some(n => !Number.isFinite(n) || n <= 0)) {
                alert('Введите положительные размеры в формате: 140x50x8 (обычный) или 140x150x45x8 (трапеция). Можно использовать x, х, * или ×.');
                return;
            }
            if (dimensions.length === 3) {
                // При вводе трех размеров сохраняем выбранную форму «С челкой».
                if (document.querySelector('.type-btn.active').dataset.type !== 'bangs') {
                    document.querySelector('.type-btn[data-type="regular"]').click();
                }
                ['length', 'width', 'height'].forEach((id, i) => document.getElementById(id).value = dimensions[i]);
            } else {
                document.querySelector('.type-btn[data-type="trapezoid"]').click();
                ['top-length', 'bottom-length', 'depth', 'trap-height'].forEach((id, i) => document.getElementById(id).value = dimensions[i]);
            }
        }

        function getRecommendedPrice(price) {
            const thousands = Math.floor(price / 1000);
            const remainder = price % 1000;
            if (remainder < 200) return thousands * 1000 - 10;
            if (remainder < 700) return thousands * 1000 + 490;
            return thousands * 1000 + 990;
        }

        function readPositiveNumber(id) {
            const value = Number(document.getElementById(id).value);
            if (!Number.isFinite(value) || value <= 0) throw new Error('Все размеры должны быть больше нуля.');
            return value;
        }

        function calculate() {
            const type = document.querySelector('.type-btn.active').dataset.type;
            const quantity = Number(document.getElementById('quantity').value);
            if (!Number.isInteger(quantity) || quantity < 1) {
                alert('Количество матрасов должно быть целым числом от 1.');
                return;
            }
            let length, width, height, topLength = null, bottomLength = null, depth = null;
            let foamCost, fabricMeters, sewingCost;
            try {
                if (type === 'regular' || type === 'bangs') {
                    length = readPositiveNumber('length');
                    width = readPositiveNumber('width');
                    height = readPositiveNumber('height');
                    const foamVolume = length * width * height / 1000000;
                    foamCost = foamVolume * 25 * 550;
                    const girth = 2 * width + 2 * height + 1;
                    fabricMeters = (girth <= 141 ? length + 2 : 2 * (length + 2)) / 100;
                } else {
                    topLength = readPositiveNumber('top-length');
                    bottomLength = readPositiveNumber('bottom-length');
                    depth = readPositiveNumber('depth');
                    height = readPositiveNumber('trap-height');
                    length = Math.max(topLength, bottomLength);
                    const foamVolume = length * depth * height / 1000000;
                    foamCost = foamVolume * 25 * 550;
                    const girth = 2 * depth + 2 * height + 1;
                    fabricMeters = (girth <= 141 ? length + 2 : 2 * (length + 2)) / 100;
                }
            } catch (error) {
                alert(error.message);
                return;
            }
            fabricMeters = Math.ceil(fabricMeters / 0.5) * 0.5;
            // Для матраса «С челкой» расход ткани всегда вдвое больше,
            // чем для обычного матраса тех же размеров.
            if (type === 'bangs') fabricMeters *= 2;
            if (length <= 199.9) sewingCost = 500;
            else if (length <= 299.9) sewingCost = 750;
            else if (length <= 399.9) sewingCost = 1000;
            else sewingCost = 1250;
            if (type === 'trapezoid') sewingCost += 250;
            // Форма «С челкой»: обычный матрас + 1250 руб. к себестоимости.
            if (type === 'bangs') sewingCost += 1250;

            const priceFor = rate => {
                const realCost = foamCost + sewingCost + fabricMeters * rate;
                const totalCost = realCost * PRICE_MULTIPLIER;
                return {
                    realCost: Math.round(realCost),
                    totalCost: Math.round(totalCost),
                    recommended: Math.round(getRecommendedPrice(totalCost))
                };
            };
            const key = type === 'trapezoid'
                ? `${topLength}x${bottomLength}x${depth}x${height}`
                : `${length}x${width}x${height}`;
            mattresses.push({
                key, type, location: selectedLocation, length, width, height,
                topLength, bottomLength, depth,
                count: quantity, fabricMeters,
                standard: priceFor(FABRIC_RATES.standard),
                premium: priceFor(FABRIC_RATES.premium)
            });
            updateResultDisplay();
            generateTexts();
        }

        function groupMattresses() {
            const groups = new Map();
            mattresses.forEach(m => {
                const key = `${m.type}|${m.location}|${m.key}`;
                if (groups.has(key)) {
                    groups.get(key).count += m.count;
                } else {
                    groups.set(key, { ...m });
                }
            });
            return Array.from(groups.values());
        }

        function formatMoney(amount) {
            return `${amount.toLocaleString('ru-RU')} руб.`;
        }

        function priceOption(title, price, count) {
            return `<div class="price-option">
                <h4>${title}</h4>
                <p>Себестоимость: ${formatMoney(price.realCost * count)}</p>
                <p>После умножения (×${PRICE_MULTIPLIER}): ${formatMoney(price.totalCost * count)}</p>
                <p>Рекомендуемая цена:</p>
                <div class="recommended-price">${formatMoney(price.recommended * count)}</div>
            </div>`;
        }

        function updateResultDisplay() {
            const resultDiv = document.getElementById('result');
            const groups = groupMattresses();
            let html = '<h3>Результаты расчета:</h3>';
            groups.forEach(m => {
                const typeName = m.type === 'trapezoid' ? 'Трапеция' : m.type === 'bangs' ? 'С челкой' : 'Обычный';
                const locationName = m.location === 'hallway' ? 'в прихожую' : 'на подоконник';
                html += `<div class="mattress-group">
                    <p><strong>Тип матраса:</strong> ${typeName} (${locationName})</p>
                    <p><strong>Размер:</strong> ${m.key.replace(/x/g, '×')} см</p>
                    ${m.count > 1 ? `<p><strong>Количество:</strong> ${m.count} шт.</p>` : ''}
                    <p class="price-note">Расход ткани: ${m.fabricMeters.toLocaleString('ru-RU')} пог. м</p>
                    <div class="price-choices">
                        ${priceOption('В стандартной ткани', m.standard, m.count)}
                        ${priceOption('В премиум ткани', m.premium, m.count)}
                    </div>
                </div>`;
            });
            if (mattresses.length > 1 || mattresses[0].count > 1) {
                const total = palette => mattresses.reduce((sum, m) => sum + m[palette].recommended * m.count, 0);
                html += `<div class="grand-total">
                    <strong>Итого (если все матрасы в одной категории ткани):</strong>
                    <p>В стандартной ткани: <span class="recommended-price">${formatMoney(total('standard'))}</span></p>
                    <p>В премиум ткани: <span class="recommended-price">${formatMoney(total('premium'))}</span></p>
                </div>`;
            }
            resultDiv.innerHTML = html;
            document.getElementById('add-mattress').style.display = 'block';
            document.getElementById('reset-calc').style.display = 'block';
            document.getElementById('additional-panel').style.display = 'block';
        }

        function generateTexts() {
            let priceText = '✍️ЦЕНА:\n';
            const groups = groupMattresses();
            groups.forEach((m, index) => {
                const dimensions = m.key.replace(/x/g, '*');
                const standardTotal = m.standard.recommended * m.count;
                const premiumTotal = m.premium.recommended * m.count;
                if (index > 0) priceText += '\n';
                priceText += `☁️Матрас${m.type === 'bangs' ? ' с челкой' : ''} ${m.height} см в высоту:\n\n`;
                priceText += `Размер ${dimensions}${m.count > 1 ? ` — ${m.count} шт.` : ''}:\n`;
                priceText += `В стандартной ткани: ${formatMoney(standardTotal)}`;
                if (m.count > 1) priceText += ` (${formatMoney(m.standard.recommended)} × ${m.count})`;
                priceText += '\n';
                priceText += `В премиум ткани: ${formatMoney(premiumTotal)}`;
                if (m.count > 1) priceText += ` (${formatMoney(m.premium.recommended)} × ${m.count})`;
                priceText += '\n';
            });
            document.getElementById('price-text').textContent = priceText.trimEnd();

            const offersText = [
                'Дополнительное предложение:',
                '',
                '☁️Эффект облака для матраса: 1490 руб. (Стоимость указана, если Ваше изделие до 1 метра в длину)',
                '',
                '🧶Кант в цвет изделия/другого цвета: 2490 руб. (Стоимость указана, если Ваше изделие до 1 метра в длину)',
                '',
                '📌Антискользящее покрытие на выбор:',
                '- Самоклеящаяся лента-липучка: 1490 руб.',
                '- Антискользящее полотно: 990 руб. (Стоимость указана, если Ваше изделие до 1 метра в длину)',
                '',
                '*Все подушки сможем сделать по Вашим размерам',
                '🔹Подушка декоративная 40*40: 1490 руб.',
                '🔹Диванная подушка высотой 40 см: 2990 руб.',
                '🔹Валик диаметр 14 см: 2490 руб.',
                '🔹Подушка под спину высотой 45 см: 2990 руб.',
                '',
                '🤝Гарантия 1 год!'
            ].join('\n');
            document.getElementById('additional-offers').textContent = offersText;
        }

        function addMattress() {
            document.getElementById('quantity').value = 1;
            const activeType = document.querySelector('.type-btn.active').dataset.type;
            document.getElementById(activeType === 'trapezoid' ? 'top-length' : 'length').focus();
        }

        function resetCalculator() {
            mattresses.length = 0;
            const defaults = {
                'length': 140, 'width': 50, 'height': 8,
                'top-length': 140, 'bottom-length': 150, 'depth': 45, 'trap-height': 8,
                'quantity': 1, 'quick-size': ''
            };
            Object.entries(defaults).forEach(([id, value]) => document.getElementById(id).value = value);
            document.querySelector('.type-btn[data-type="regular"]').click();
            document.querySelector('.location-btn[data-location="windowsill"]').click();
            document.getElementById('result').textContent = 'Введите параметры и нажмите "Рассчитать"';
            ['additional-panel', 'add-mattress', 'reset-calc'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById('price-text').textContent = '';
            document.getElementById('additional-offers').textContent = '';
        }

        function copyToClipboard(event) {
            const block = event.currentTarget;
            const text = block.querySelector('div').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const notification = block.querySelector('.copy-notification');
                notification.style.display = 'inline';
                setTimeout(() => notification.style.display = 'none', 2000);
            }).catch(() => {
                alert('Не удалось скопировать текст автоматически. Выделите текст и скопируйте вручную.');
            });
        }
    </script>
</body>
</html>
